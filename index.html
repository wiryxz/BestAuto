<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo</title>
  <style>
    :root{
      --bg:#0b1020;
      --text:#e8ecff;
      --muted:#a7b0d6;
      --brand:#7c5cff;
      --brand2:#2dd4bf;
      --ring: color-mix(in srgb, var(--brand) 35%, transparent);
      --shadow: 0 18px 45px rgba(0,0,0,.45);
      --radius: 18px;

      /* Logo controls */
      --logo-size: 40px;
      --logo-radius: 12px;
      --logo-align: flex-start; /* flex-start | center */
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 700px at 20% -10%,
          color-mix(in srgb, var(--brand) 35%, transparent),
          transparent 55%),
        radial-gradient(900px 600px at 90% 10%,
          color-mix(in srgb, var(--brand2) 25%, transparent),
          transparent 60%),
        radial-gradient(900px 600px at 50% 110%, rgba(255,255,255,.06), transparent 60%),
        var(--bg);
      color:var(--text);
    }
    .wrap{ max-width:1180px; margin:0 auto; padding:24px; }

    .topbar{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,16,32,.9), rgba(11,16,32,.65));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar-inner{
      max-width:1180px; margin:0 auto; padding:16px 24px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }

    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight:800; letter-spacing:.3px;
      width:100%;
      justify-content: var(--logo-align);
    }

    .logo-box{
      width:var(--logo-size);
      height:var(--logo-size);
      border-radius: var(--logo-radius);
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 10px 25px color-mix(in srgb, var(--brand) 25%, transparent);
      display:grid; place-items:center;
      font-weight:900;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .logo-box img{ width:100%; height:100%; object-fit:cover; display:none; }

    .hero{
      position:relative;
      overflow:hidden;
      padding:18px;
      border-radius: var(--radius);
      background:
        radial-gradient(700px 250px at 20% 10%,
          color-mix(in srgb, var(--brand) 18%, transparent),
          transparent 50%),
        radial-gradient(700px 250px at 90% 20%,
          color-mix(in srgb, var(--brand2) 16%, transparent),
          transparent 55%),
        rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      margin-top:18px;
      display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
      flex-wrap:wrap;
    }
    .hero h1{ margin:0; font-size:22px; }
    .hero .sub{ color:var(--muted); font-size:13px; margin-top:6px; max-width:700px; line-height:1.4; }

    /* Decorative images container */
    .decos{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:0;
    }
    .deco{
      position:absolute;
      transform: translate(-50%, -50%);
      filter: saturate(1.05);
    }
    .hero > *{ position:relative; z-index:1; }

    .controls{
      display:grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      gap:10px;
      margin: 12px 0 2px;
    }
    @media (max-width: 640px){ .controls{ grid-template-columns: 1fr; } }

    .input, select{
      width:100%;
      padding:11px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(15,23,48,.6);
      color: var(--text);
      outline:none;
    }
    .input:focus, select:focus{
      box-shadow: 0 0 0 4px var(--ring);
      border-color: color-mix(in srgb, var(--brand) 40%, rgba(255,255,255,.10));
    }
    .divider{ height:1px; background: rgba(255,255,255,.08); margin:14px 0; }

    .gallery{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
      margin-top:8px;
    }
    @media (max-width: 980px){ .gallery{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px){ .gallery{ grid-template-columns: 1fr; } }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      display:flex;
      flex-direction:column;
    }
    .thumb{ position:relative; aspect-ratio: 16/10; background: rgba(255,255,255,.04); overflow:hidden; }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; transform: scale(1.02); filter: saturate(1.06); }
    .badge{
      position:absolute; top:10px; left:10px;
      padding:6px 10px; border-radius:999px;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.15);
      font-size:12px; color: #fff;
      display:inline-flex; align-items:center; gap:8px;
      backdrop-filter: blur(6px);
    }
    .b-ok{ background: rgba(34,197,94,.18); }
    .b-warn{ background: rgba(245,158,11,.18); }
    .b-danger{ background: rgba(239,68,68,.18); }

    .card-body{ padding:12px 12px 10px; display:flex; flex-direction:column; gap:10px; }
    .title{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .title h3{ margin:0; font-size:15px; line-height:1.2; }

    /* ✅ This is where the brand colors now apply */
    .price{
      font-weight:900;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      white-space:nowrap;
      font-size:15px;
    }

    .meta{ display:flex; gap:8px; flex-wrap:wrap; color: var(--muted); font-size:12px; }
    .chip{ padding:6px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03); }
    .desc{ color: var(--muted); font-size:12.5px; line-height:1.35; min-height: 34px; }
    .card-actions{ padding: 0 12px 12px; display:flex; gap:8px; flex-wrap:wrap; }

    .btn{
      border:0; cursor:pointer;
      padding:10px 12px; border-radius:14px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border:1px solid rgba(255,255,255,.10);
      display:inline-flex; align-items:center; gap:10px;
      font-size:13px; text-decoration:none;
    }

    /* ✅ Primary uses your theme colors */
    .btn.primary{
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      border:1px solid rgba(255,255,255,.18);
    }
    .btn.ok{ background: rgba(34,197,94,.13); border-color: rgba(34,197,94,.28); }

    .empty{
      padding:18px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius: 18px;
      color: var(--muted);
      text-align:center;
      background: rgba(255,255,255,.02);
      margin-top:12px;
    }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.62);
      display:none;
      align-items:center; justify-content:center;
      padding: 18px; z-index:100;
    }
    .modal{
      width:min(980px, 100%);
      background: linear-gradient(180deg, rgba(17,26,51,.98), rgba(15,23,48,.96));
      border:1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modal-head{
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .modal-head h3{ margin:0; font-size:15px; }
    .modal-body{
      padding:16px;
      display:grid; grid-template-columns: 1.2fr .8fr; gap:14px;
    }
    @media (max-width: 900px){ .modal-body{ grid-template-columns: 1fr; } }
    .modal-img{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      aspect-ratio: 16/10;
    }
    .modal-img img{ width:100%; height:100%; object-fit:cover; display:block; }
    .kv{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .kv div{
      background: rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding:10px 12px;
    }
    .k{ font-size:11px; color:var(--muted); }
    .v{ margin-top:6px; font-weight:650; }
    .modal-footer{
      padding: 0 16px 16px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo-box" id="logoBox">
          <span id="logoText">A</span>
          <img id="logoImg" alt="Logo">
        </div>
        <div>
          <div id="siteName">AutoShowroom</div>
          <div style="font-size:12px;color:var(--muted);font-weight:600;" id="siteTagline">Carros disponibles</div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="hero" id="hero">
      <div class="decos" id="decos"></div>

      <div>
        <h1 id="heroTitle">Tu vitrina de carros</h1>
        <div class="sub" id="heroSubtitle">Busca, filtra y abre cada carro para ver el detalle y contactar por WhatsApp.</div>
      </div>
    </div>

    <div class="controls">
      <input class="input" id="q" placeholder="Buscar: marca, modelo, ciudad, placa, etc..." />
      <select id="filterStatus">
        <option value="all">Todos</option>
        <option value="available">Disponibles</option>
        <option value="reserved">Reservados</option>
        <option value="sold">Vendidos</option>
      </select>
      <select id="sortBy">
        <option value="newest">Más nuevos</option>
        <option value="priceAsc">Precio: menor a mayor</option>
        <option value="priceDesc">Precio: mayor a menor</option>
        <option value="yearDesc">Año: más nuevo</option>
        <option value="kmAsc">Km: menor a mayor</option>
      </select>
    </div>

    <div class="divider"></div>

    <div id="gallery" class="gallery"></div>
    <div id="emptyState" class="empty" style="display:none;">
      No hay carros que coincidan con el filtro/búsqueda.
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="mTitle">Detalle</h3>
        <button class="btn" id="btnClose">Cerrar</button>
      </div>
      <div class="modal-body">
        <div class="modal-img"><img id="mImg" alt="Foto del carro"></div>
        <div>
          <div class="price" id="mPrice" style="font-size:20px; margin-bottom:10px;"></div>
          <div class="kv" id="mKv"></div>
          <div style="margin-top:12px; color:var(--muted); line-height:1.4; font-size:13px;" id="mDesc"></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn ok" id="mWhats" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn" id="mCopy">Copiar info</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, doc, query, orderBy, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ====== Pega tu config aquí ======
    const firebaseConfig = {
        apiKey: "AIzaSyBHKAsIFV4lZ4f1sCiTTZTJOylyp-aIuUQ",
        authDomain: "venta-autos-c1eb9.firebaseapp.com",
        databaseURL: "https://venta-autos-c1eb9-default-rtdb.firebaseio.com",
        projectId: "venta-autos-c1eb9",
        storageBucket: "venta-autos-c1eb9.firebasestorage.app",
        messagingSenderId: "868320914224",
        appId: "1:868320914224:web:9c701671b46f02d4f8b6f5",
        measurementId: "G-VX6C46EGTJ"
      };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function fallbackImg(){
      const svg = encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c5cff" stop-opacity=".85"/>
            <stop offset="1" stop-color="#2dd4bf" stop-opacity=".75"/>
          </linearGradient></defs>
          <rect width="100%" height="100%" fill="#0b1020"/>
          <text x="60" y="380" fill="#e8ecff" font-size="56" font-family="Arial" font-weight="800">Sin foto</text>
        </svg>
      `);
      return `data:image/svg+xml;charset=utf-8,${svg}`;
    }
    function formatCOP(n){
      const num = Number(n || 0);
      return num.toLocaleString("es-CO", { style:"currency", currency:"COP", maximumFractionDigits:0 });
    }
    function formatInt(n){
      const num = Number(n || 0);
      return num.toLocaleString("es-CO");
    }
    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }
    function badgeFor(status){
      if(status==="available") return {txt:"Disponible", cls:"b-ok"};
      if(status==="reserved") return {txt:"Reservado", cls:"b-warn"};
      return {txt:"Vendido", cls:"b-danger"};
    }
    function whatsLink(c, defaultWhats){
      const phone = (c.whatsapp || defaultWhats || "").replace(/\s/g,"");
      const txt = encodeURIComponent(
        `Hola! Me interesa el carro: ${c.title}\n` +
        `Precio: ${formatCOP(c.price)}\n` +
        `Año: ${c.year} | Km: ${formatInt(c.km)}\n` +
        `Ubicación: ${c.location || "—"}\n` +
        `${c.plate ? "Placa: " + c.plate + "\n" : ""}` +
        `¿Sigue disponible?`
      );
      if(!phone) return `https://wa.me/?text=${txt}`;
      const clean = phone.replace(/^\+/, "");
      return `https://wa.me/${clean}?text=${txt}`;
    }

    function setCssVar(name, value){
      if(value === undefined || value === null || value === "") return;
      document.documentElement.style.setProperty(name, value);
    }

    // ===== Theme apply (LIVE) =====
    async function applyThemeOnce(){
      const ref = doc(db, "settings", "theme");
      const snap = await getDoc(ref);
      const t = snap.exists() ? snap.data() : {};

      // ✅ apply vars
      setCssVar("--brand", t.brand);
      setCssVar("--brand2", t.brand2);
      setCssVar("--bg", t.bg);

      // logo controls
      setCssVar("--logo-size", (t.logoSizePx ? `${t.logoSizePx}px` : ""));
      setCssVar("--logo-align", t.logoAlign === "center" ? "center" : "flex-start");

      $("#siteName").textContent = t.siteName || "AutoShowroom";
      $("#siteTagline").textContent = t.tagline || "Carros disponibles";
      $("#heroTitle").textContent = t.heroTitle || "Tu vitrina de carros";
      $("#heroSubtitle").textContent = t.heroSubtitle || "Busca, filtra y abre cada carro para ver el detalle y contactar por WhatsApp.";

      // logo
      const logoText = $("#logoText");
      const logoImg = $("#logoImg");
      const box = $("#logoBox");

      if(t.logoImage){
        logoImg.src = t.logoImage;
        logoImg.style.display = "block";
        logoText.style.display = "none";
        box.style.background = "transparent";
      }else{
        logoText.textContent = (t.logoText || "A").slice(0,2).toUpperCase();
        logoText.style.display = "block";
        logoImg.style.display = "none";
        box.style.background = `linear-gradient(135deg, var(--brand), var(--brand2))`;
      }

      // decorative images
      renderDecos(t.decorations || []);

      document.title = (t.siteName ? `${t.siteName} — Catálogo` : "Catálogo");
      return t;
    }

    function renderDecos(decorations){
      const container = $("#decos");
      container.innerHTML = "";
      for(const d of decorations){
        if(!d || !d.src) continue;
        const el = document.createElement("img");
        el.className = "deco";
        el.src = d.src;
        el.alt = "";
        el.style.left = `${Number(d.xPct ?? 50)}%`;
        el.style.top = `${Number(d.yPct ?? 50)}%`;
        el.style.width = `${Number(d.widthPx ?? 220)}px`;
        el.style.opacity = String(Number(d.opacity ?? 0.18));
        el.style.rotate = `${Number(d.rotateDeg ?? 0)}deg`;
        el.style.filter = `saturate(1.05) drop-shadow(0 18px 30px rgba(0,0,0,.25))`;
        container.appendChild(el);
      }
    }

    let theme = await applyThemeOnce();

    // live theme updates
    onSnapshot(doc(db,"settings","theme"), (snap)=>{
      if(snap.exists()){
        theme = snap.data();
        applyThemeOnce();
        renderGallery();
      }
    });

    // ===== Cars =====
    let cars = [];

    function getFiltered(){
      const q = ($("#q").value || "").trim().toLowerCase();
      const fs = $("#filterStatus").value;
      const sort = $("#sortBy").value;

      let arr = cars.slice();
      if(fs !== "all") arr = arr.filter(c => c.status === fs);

      if(q){
        arr = arr.filter(c => {
          const hay = [
            c.title, c.location, c.fuel, c.transmission, c.plate,
            String(c.year), String(c.price), String(c.km)
          ].join(" ").toLowerCase();
          return hay.includes(q);
        });
      }

      arr.sort((a,b)=>{
        if(sort==="newest") return (b.createdAt||0)-(a.createdAt||0);
        if(sort==="priceAsc") return (a.price||0)-(b.price||0);
        if(sort==="priceDesc") return (b.price||0)-(a.price||0);
        if(sort==="yearDesc") return (b.year||0)-(a.year||0);
        if(sort==="kmAsc") return (a.km||0)-(b.km||0);
        return 0;
      });
      return arr;
    }

    function renderGallery(){
      const list = getFiltered();
      const gallery = $("#gallery");
      gallery.innerHTML = "";
      $("#emptyState").style.display = list.length ? "none" : "block";

      for(const c of list){
        const b = badgeFor(c.status);
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="thumb">
            <img src="${c.image || fallbackImg()}" alt="${escapeHtml(c.title)}">
            <div class="badge ${b.cls}">● ${b.txt}</div>
          </div>
          <div class="card-body">
            <div class="title">
              <h3>${escapeHtml(c.title)}</h3>
              <div class="price">${formatCOP(c.price)}</div>
            </div>
            <div class="meta">
              <span class="chip">${escapeHtml(String(c.year||"—"))}</span>
              <span class="chip">${formatInt(c.km)} km</span>
              <span class="chip">${escapeHtml(c.fuel||"—")}</span>
              <span class="chip">${escapeHtml(c.transmission||"—")}</span>
            </div>
            <div class="desc">${escapeHtml(c.desc || "Sin descripción.")}</div>
            <div class="meta">
              <span class="chip">📍 ${escapeHtml(c.location || "Sin ubicación")}</span>
              ${c.plate ? `<span class="chip">🪪 ${escapeHtml(c.plate)}</span>` : ""}
            </div>
          </div>
          <div class="card-actions">
            <button class="btn primary" data-open="${c.id}">Ver</button>
            <a class="btn ok" href="${whatsLink(c, theme.defaultWhatsapp)}" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        `;
        gallery.appendChild(el);
      }
      $$("[data-open]").forEach(b => b.onclick = () => openModal(b.dataset.open));
    }

    // Modal
    const modalBackdrop = $("#modalBackdrop");
    function openModal(id){
      const c = cars.find(x => x.id === id);
      if(!c) return;

      $("#mTitle").textContent = c.title;
      $("#mImg").src = c.image || fallbackImg();
      $("#mPrice").textContent = formatCOP(c.price);
      $("#mDesc").textContent = c.desc || "Sin descripción.";

      const items = [
        ["Estado", badgeFor(c.status).txt],
        ["Año", c.year || "—"],
        ["Kilometraje", formatInt(c.km) + " km"],
        ["Combustible", c.fuel || "—"],
        ["Transmisión", c.transmission || "—"],
        ["Ubicación", c.location || "—"],
        ["Placa", c.plate || "—"]
      ];
      $("#mKv").innerHTML = items.map(([k,v]) => `
        <div><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>
      `).join("");

      $("#mWhats").href = whatsLink(c, theme.defaultWhatsapp);

      $("#mCopy").onclick = () => {
        const text =
          `${c.title}\n` +
          `Precio: ${formatCOP(c.price)}\n` +
          `Año: ${c.year} | Km: ${formatInt(c.km)}\n` +
          `Combustible: ${c.fuel} | Transmisión: ${c.transmission}\n` +
          `Ubicación: ${c.location || "—"}\n` +
          `${c.plate ? "Placa: "+c.plate+"\n" : ""}` +
          `${c.desc ? "Detalle: "+c.desc+"\n" : ""}`;
        navigator.clipboard?.writeText(text);
      };

      modalBackdrop.style.display = "flex";
      modalBackdrop.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modalBackdrop.style.display = "none";
      modalBackdrop.setAttribute("aria-hidden","true");
    }
    $("#btnClose").onclick = closeModal;
    modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeModal(); });
    window.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeModal(); });

    // Live cars
    const carsRef = collection(db, "cars");
    const qCars = query(carsRef, orderBy("createdAt","desc"));
    onSnapshot(qCars, (snap)=>{
      cars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGallery();
    });

    ["q","filterStatus","sortBy"].forEach(id=>{
      $("#"+id).addEventListener("input", renderGallery);
      $("#"+id).addEventListener("change", renderGallery);
    });
  </script>
</body>
</html>
